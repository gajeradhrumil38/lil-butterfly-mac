name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build app bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          APP_VERSION="$VERSION" ./scripts/make_app_bundle.sh
          ditto -c -k --sequesterRsrc --keepParent "LilButterfly.app" "LilButterfly-$VERSION-${{ matrix.arch }}.zip"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: LilButterfly-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "Lil Butterfly ${RELEASE_TAG#v}" \
            --generate-notes
