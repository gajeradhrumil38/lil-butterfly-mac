name: Build and publish Butterfly

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package:
    name: Build and package
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package app bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          APP_VERSION="${RELEASE_TAG#v}" ./scripts/make_app_bundle.sh
          ditto -c -k --sequesterRsrc --keepParent Butterfly.app "Butterfly-${RELEASE_TAG#v}.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Butterfly-app
          path: Butterfly-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: Butterfly-app
          path: dist

      - name: Create release and attach app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/Butterfly-*.zip \
            --repo "${{ github.repository }}" \
            --title "Butterfly ${RELEASE_TAG#v}" \
            --generate-notes
